name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  build-web-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web-ui
        uses: docker/build-push-action@v5
        with:
          context: ./web-ui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shlink-bff/web-ui:latest
            ghcr.io/${{ github.repository_owner }}/shlink-bff/web-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-unified-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push unified-backend
        uses: docker/build-push-action@v5
        with:
          context: ./unified-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shlink-bff/unified-backend:latest
            ghcr.io/${{ github.repository_owner }}/shlink-bff/unified-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
