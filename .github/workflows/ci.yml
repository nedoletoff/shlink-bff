name: CI - Shlink Backend for Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: shlink_bff_test
          POSTGRES_USER: bff
          POSTGRES_PASSWORD: bff_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bff -d shlink_bff_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: unified-backend/go.sum

      - name: Download dependencies
        working-directory: unified-backend
        run: go mod download

      - name: Vet
        working-directory: unified-backend
        run: go vet ./...

      - name: Build
        working-directory: unified-backend
        run: go build ./...

      - name: Run migrations
        working-directory: unified-backend
        env:
          PGPASSWORD: bff_test_password
        run: |
          for f in internal/migrations/sql/*.sql; do
            psql -h 127.0.0.1 -U bff -d shlink_bff_test -f "$f"
          done

      - name: Test
        working-directory: unified-backend
        env:
          DATABASE_URL: postgres://bff:bff_test_password@127.0.0.1:5432/shlink_bff_test?sslmode=disable
          SHLINK_INTERNAL_URL: http://localhost:8080
        run: go test -v -race ./...

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: unified-backend/go.sum

      - name: Download dependencies
        working-directory: unified-backend
        run: go mod download

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.12.2

      - name: Run golangci-lint
        working-directory: unified-backend
        run: golangci-lint run ./...

  web-ui:
    name: Build & Lint (Web UI)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: web-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload web-ui build artifact
        uses: actions/upload-artifact@v6
        with:
          name: web-ui-dist
          path: web-ui/dist
          if-no-files-found: error

  docker-backend:
    name: Docker Build & Push (Go)
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set backend image names
        id: meta
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/shlink-bff-go
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build backend Docker image
        run: |
          docker build \
            -f unified-backend/Dockerfile \
            -t ${{ steps.meta.outputs.sha_tag }} \
            -t ${{ steps.meta.outputs.latest_tag }} \
            ./unified-backend

      - name: Push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.meta.outputs.sha_tag }}
          docker push ${{ steps.meta.outputs.latest_tag }}

  docker-web-ui:
    name: Docker Build & Push (Web UI)
    runs-on: ubuntu-latest
    needs: [web-ui]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set web-ui image names
        id: meta
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/shlink-bff-web-ui
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build web-ui Docker image
        run: |
          docker build \
            -f web-ui/Dockerfile \
            -t ${{ steps.meta.outputs.sha_tag }} \
            -t ${{ steps.meta.outputs.latest_tag }} \
            ./web-ui

      - name: Push web-ui Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.meta.outputs.sha_tag }}
          docker push ${{ steps.meta.outputs.latest_tag }}
