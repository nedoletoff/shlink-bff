name: CI — Python Backend

on:
  push:
    branches: [feature/python-fastapi-backend]
  pull_request:
    branches: [main, feature/python-fastapi-backend]

jobs:
  test:
    name: Build & Test (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hatch
        run: pip install hatch

      - name: Install dependencies
        working-directory: python-backend
        run: hatch dep show requirements --all

      - name: Install project with dev deps
        working-directory: python-backend
        run: pip install -e '.[dev]'

      - name: Run migrations (SQLite in-memory skipped; using test fixtures)
        run: echo "Migrations handled by test fixtures"

      - name: Run tests
        working-directory: python-backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-secret-key-for-ci
          SHLINK_API_URL: http://localhost:8080
          SHLINK_API_KEY: test-key
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint & Type Check (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        working-directory: python-backend
        run: pip install -e '.[dev]'

      - name: Ruff lint
        working-directory: python-backend
        run: ruff check .

      - name: Ruff format check
        working-directory: python-backend
        run: ruff format --check .

      - name: Mypy type check
        working-directory: python-backend
        run: mypy app/

  docker:
    name: Docker Build (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shlink-bff-python:ci ./python-backend
