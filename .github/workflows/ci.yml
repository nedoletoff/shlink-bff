name: CI - Go Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shlink_bff_test
          POSTGRES_USER: bff
          POSTGRES_PASSWORD: bff_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bff -d shlink_bff_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: unified-backend/go.sum

      - name: Download dependencies
        working-directory: unified-backend
        run: go mod tidy

      - name: Vet
        working-directory: unified-backend
        run: go vet ./...

      - name: Build
        working-directory: unified-backend
        run: go build ./...

      - name: Run migrations
        working-directory: unified-backend
        env:
          PGPASSWORD: bff_test_password
        run: |
          for f in migrations/*.sql; do
            psql -h 127.0.0.1 -U bff -d shlink_bff_test -f "$f"
          done

      - name: Test
        working-directory: unified-backend
        env:
          DATABASE_URL: postgres://bff:bff_test_password@127.0.0.1:5432/shlink_bff_test?sslmode=disable
          SHLINK_INTERNAL_URL: http://localhost:8080
        run: go test -v -race ./...

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: unified-backend/go.sum

      - name: Download dependencies
        working-directory: unified-backend
        run: go mod tidy

      - name: Install golangci-lint
              run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v1.64.8

      - name: Run golangci-lint
        working-directory: unified-backend
        run: golangci-lint run ./...

  docker:
    name: Docker Build (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shlink-bff-go:ci ./unified-backend

  web-ui:
    name: Build & Lint (Web UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
