name: CI - Python Backend

on:
  push:
    branches: [feature/python-fastapi-backend]
  pull_request:
    branches: [main, feature/python-fastapi-backend]

jobs:
  test:
    name: Build & Test (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project with dev deps
        working-directory: python-backend
        run: pip install -e '.[dev]'

      - name: Run tests
        working-directory: python-backend
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          SHLINK_INTERNAL_URL: 'http://localhost:8080'
        run: pytest tests/ -v --tb=short

  lint:
    name: Lint & Type Check (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        working-directory: python-backend
        run: pip install -e '.[dev]'

      - name: Ruff lint
        working-directory: python-backend
        run: ruff check .

      - name: Ruff format check
        working-directory: python-backend
        run: ruff format --check .


  docker:
    name: Docker Build (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shlink-bff-python:ci ./python-backend
