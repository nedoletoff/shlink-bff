name: CI — Go Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shlink_bff_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: unified-backend/go.sum

      - name: Download dependencies
        working-directory: unified-backend
        run: go mod download

      - name: Vet
        working-directory: unified-backend
        run: go vet ./...

      - name: Build
        working-directory: unified-backend
        run: go build ./...

      - name: Run migrations
        working-directory: unified-backend
        env:
          DB_DSN: root:root@tcp(127.0.0.1:3306)/shlink_bff_test?parseTime=true
        run: |
          for f in migrations/*.sql; do
            mysql -h 127.0.0.1 -u root -proot shlink_bff_test < "$f"
          done

      - name: Test
        working-directory: unified-backend
        env:
          DB_DSN: root:root@tcp(127.0.0.1:3306)/shlink_bff_test?parseTime=true
        run: go test -v -race ./...

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: unified-backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: unified-backend

  docker:
    name: Docker Build (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shlink-bff-go:ci ./unified-backend
