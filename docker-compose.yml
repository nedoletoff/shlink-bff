# Shlink BFF — docker-compose
#
# Архитектура:
#   Browser -> nginx -> oauth2-proxy -> python-backend -> shlink-api
#
# Перед запуском:
#   cp .env.example .env && vi .env
#   Скопируйте nginx/nginx.conf.example -> nginx/nginx.conf
#   Скопируйте oauth2-proxy/shlink.cfg.example -> oauth2-proxy/shlink.cfg
#   Положите SSL-сертификат в nginx/ssl/cert.pem

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -- Nginx -- точка входа --
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - internal
    depends_on:
      python-backend:
        condition: service_healthy
      web-ui:
        condition: service_healthy
      oauth2-proxy-shlink:
        condition: service_started
    logging: *default-logging
    restart: unless-stopped

  # -- Shlink API -- внутренний сервис, без публичных портов --
  # Использует встроенный SQLite (DB_DRIVER=sqlite)
  shlink-api:
    image: shlinkio/shlink:5.0.2
    container_name: shlink-api
    environment:
      DB_DRIVER: sqlite
      DEFAULT_DOMAIN: ${DOMAIN_SHORT}
      IS_HTTPS_ENABLED: "true"
      INITIAL_API_KEY: ${ADMIN_SHLINK_API_KEY}
      TRUSTED_PROXIES: nginx
    volumes:
      - shlink_data:/data
    networks:
      - internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rest/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # -- Python Backend (FastAPI + SQLite) --
  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: python-backend
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8080"
      # SQLite file inside container; persist via volume
      DATABASE_URL: "sqlite+aiosqlite:////data/shlink_bff.db"
      SHLINK_INTERNAL_URL: "http://shlink-api:8080"
      SHLINK_API_KEY: ${ADMIN_SHLINK_API_KEY}
      FEATURE_USER_SLUG_PREFIX: ${FEATURE_USER_SLUG_PREFIX:-false}
      FEATURE_USER_TAG_INTERNAL_ID: ${FEATURE_USER_TAG_INTERNAL_ID:-false}
    volumes:
      - python_backend_data:/data
    networks:
      - internal
    expose:
      - "8080"
    depends_on:
      shlink-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # -- Web UI (React SPA) --
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: web-ui
    networks:
      - internal
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # -- oauth2-proxy --
  # SECURITY: зафиксирован тег, не использовать latest
  oauth2-proxy-shlink:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    container_name: oauth2-proxy-shlink
    volumes:
      - ./oauth2-proxy/shlink.cfg:/oauth2-proxy.cfg:ro
    command: --config=/oauth2-proxy.cfg
    extra_hosts:
      - "${KEYCLOAK_HOST}:${KEYCLOAK_IP}"
    networks:
      - internal
    expose:
      - "4180"
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET_SHLINK}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
    logging: *default-logging
    restart: unless-stopped

volumes:
  shlink_data:
  python_backend_data:

networks:
  internal:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
